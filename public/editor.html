    <script>
      var isDark = {{if .dark}}true{{else}}false{{end}};
      document.addEventListener('DOMContentLoaded', function() {
        if (isDark) {
          document.body.style.background = '#1b1d22';
        } else {
          document.body.style.background = '#fff';
        }
      });
    </script>
    <style>
        body {
            color: #333;
            font-family: Arial, Tahoma, sans-serif;
            font-size: 12px;
            font-weight: normal;
            height: 100%;
            margin: 0;
            overflow-y: hidden;
            padding: 0;
            text-decoration: none;
        }

        .form {
            height: 100%;
            visibility: hidden;
        }

        .form_visible {
            visibility: visible;
        }

        div {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <div class="form">
        <div id="iframeEditor">
        </div>
    </div>
    <script type="text/javascript" src="{{.apijs}}"></script>
    <script type="text/javascript" language="javascript">
        const ONLYOFFICE_CLOSE_EVENT = new Event('onlyofficecloseeditor');
        const ONLYOFFICE_READY_EVENT = new Event('onlyofficeready');
        const ONLYOFFICE_ERROR_EVENT = new Event('onlyofficeerror');

        var docEditor;
        var mentionsAuthCode = "{{.mentionscode}}";

        var innerAlert = function (message) {
            if (console && console.log)
                console.log(message);
        };

        var onAppReady = function () {
            innerAlert("Document editor ready");
            const form = document.getElementsByClassName('form').item(0);
            if (form) {
                window.parent.dispatchEvent(ONLYOFFICE_READY_EVENT);
                form.classList.add('form_visible');
            }
        };

        // true while the user has changes that are not yet sent to ONLYOFFICE Docs
        // (onDocumentStateChange). Closing the tab at that moment loses them.
        var hasUnsentChanges = false;

        var onDocumentStateChange = function (event) {
            hasUnsentChanges = !!(event && event.data);
        };

        // Browser tab "X" / reload while changes are still being sent: ask the user to stay.
        window.addEventListener("beforeunload", function (e) {
            if (hasUnsentChanges) {
                e.preventDefault();
                e.returnValue = "";
                return "";
            }
        });

        var closeTab = function () {
            window.close();
            // Browsers refuse to close tabs not opened by a script: go back to Mattermost instead.
            setTimeout(function () { window.location.href = "/"; }, 300);
        };

        var onRequestClose = function () {
            // Opened as a separate tab/window (not inside the Mattermost modal).
            // The editor itself warns about unsaved changes before calling onRequestClose.
            if (window.opener || window.top === window) {
                hasUnsentChanges = false;
                closeTab();
                return;
            }
            window.parent.dispatchEvent(ONLYOFFICE_CLOSE_EVENT);
            docEditor.destroyEditor();
        };

        var replaceActionLink = function (href, linkParam) {
            var link;
            var actionIndex = href.indexOf("&action=");
            if (actionIndex != -1) {
                var endIndex = href.indexOf("&", actionIndex + "&action=".length);
                if (endIndex != -1) {
                    link = href.substring(0, actionIndex) + href.substring(endIndex) + "&action=" + encodeURIComponent(linkParam);
                } else {
                    link = href.substring(0, actionIndex) + "&action=" + encodeURIComponent(linkParam);
                }
            } else {
                link = href + "&action=" + encodeURIComponent(linkParam);
            }
            return link;
        }

        var onError = function (event) {
            if (event) innerAlert(event.data);
        };

        var onRequestRefreshFile = function () {
            const urlParams = new URLSearchParams(window.location.search);
            const fileId = urlParams.get('file');
            const lang = urlParams.get('lang') || 'en';
            const dark = urlParams.get('dark') || 'false';

            fetch('/plugins/com.onlyoffice.mattermost/api/editor/config?file=' + fileId + '&lang=' + lang + '&dark=' + dark, {
                method: 'GET',
                credentials: 'include'
            })
            .then((response) => {
                if (!response.ok) {
                    window.parent.dispatchEvent(ONLYOFFICE_CLOSE_EVENT);
                    return;
                }
                
                return response.json();
            })
            .then((config) => {
                if (config) {
                    docEditor.refreshFile(config);
                }
            })
            .catch((error) => {
                window.parent.dispatchEvent(ONLYOFFICE_CLOSE_EVENT);
            });
        };

        var onRequestUsers = function (event) {
            if (event && event.data) {
                var c = event.data.c;
                const urlParams = new URLSearchParams(window.location.search);
                const fileId = urlParams.get('file');
                
                if (!fileId) {
                    return;
                }

                if (!mentionsAuthCode) {
                    return;
                }

                var allUsers = [];
                var currentFrom = 0;
                var requestedCount = 10;
                var search = event.data.search || '';
                
                function fetchPage(from) {
                    var queryParams = 'file=' + fileId + '&code=' + mentionsAuthCode + '&c=' + c;
                    queryParams += '&from=' + from;
                    queryParams += '&count=' + requestedCount;
                    if (search) {
                        queryParams += '&search=' + encodeURIComponent(search);
                    }

                    return fetch('/plugins/com.onlyoffice.mattermost/api/mentions/users?' + queryParams, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include'
                    })
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(err => {
                                throw new Error(err.error || 'Request failed with status ' + response.status);
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.users && data.users.length > 0) {
                            allUsers = allUsers.concat(data.users);
                        }
                        
                        if (data.hasMore) {
                            return fetchPage(from + requestedCount);
                        } else {
                            var result = {
                                c: c,
                                users: allUsers
                            };
                            
                            docEditor.setUsers(result);
                        }
                    });
                }
                
                fetchPage(0).catch(error => {
                    innerAlert("Error loading users: " + error.message);
                });
            }
        };

        var onRequestSendNotify = function (event) {
            if (event && event.data) {
                const urlParams = new URLSearchParams(window.location.search);
                const fileId = urlParams.get('file');
                
                if (!fileId) {
                    return;
                }

                if (!mentionsAuthCode) {
                    return;
                }

                const payload = {
                    fileId: fileId,
                    emails: event.data.emails || [],
                    message: event.data.message || "",
                    actionLink: event.data.actionLink || ""
                };

                fetch('/plugins/com.onlyoffice.mattermost/api/mentions/notify?code=' + mentionsAuthCode, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.error || 'Request failed with status ' + response.status);
                        });
                    }
                    return response.json();
                })
                .catch(error => {
                    innerAlert("Error sending notifications: " + error.message);
                });
            }
        };

        var events = {
            "onAppReady": onAppReady,
            "onRequestClose": onRequestClose,
            "onDocumentStateChange": onDocumentStateChange,
            "onError": onError,
            "onRequestRefreshFile": onRequestRefreshFile,
            "onRequestUsers": onRequestUsers,
            "onRequestSendNotify": onRequestSendNotify,
        };

        var config = {{ .config }};
        config["events"] = events;
        if (window.top === window && config.document && config.document.title) {
            document.title = config.document.title + " - ONLYOFFICE";
        }

        var connectEditor = function () {
            try {
                docEditor = new DocsAPI.DocEditor("iframeEditor", config);
                fixSize();
            } catch {
                innerAlert('[ONLYOFFICE Error]: could not initialize DocsAPI instance');
                window.parent.dispatchEvent(ONLYOFFICE_ERROR_EVENT);
            }
        };

        var fixSize = function () {
            var wrapEl = document.getElementsByClassName("form");
            if (wrapEl.length) {
                wrapEl[0].style.height = screen.availHeight + "px";
                window.scrollTo(0, -1);
                wrapEl[0].style.height = window.innerHeight + "px";
            }
        };

        if (window.addEventListener) {
            window.addEventListener("load", connectEditor);
            window.addEventListener("resize", fixSize);
        } else if (window.attachEvent) {
            window.attachEvent("onload", connectEditor);
            window.attachEvent("onresize", fixSize);
        }
    </script>
</body>

</html>
