name: E2E

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      mattermost_version:
        description: 'mattermost/mattermost image tag'
        default: '11.10.1'
      documentserver_image:
        description: 'Document Server image'
        default: 'onlyoffice/documentserver:latest'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Get Info
        id: info
        run: |
          echo "id=$(jq -r '.id' plugin.json)" >> $GITHUB_OUTPUT
          echo "version=$(jq -r '.version' plugin.json)" >> $GITHUB_OUTPUT

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build Plugin
        run: |
          make dist

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/${{ steps.info.outputs.id }}-${{ steps.info.outputs.version }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  e2e:
    needs: build
    uses: ONLYOFFICE/integration-tests/.github/workflows/e2e.yml@develop
    with:
      system: mattermost
      artifact_name: plugin
      documentserver_image: ${{ inputs.documentserver_image || 'onlyoffice/documentserver:latest' }}
      env_overrides: MATTERMOST_VERSION=${{ inputs.mattermost_version || '11.10.1' }}