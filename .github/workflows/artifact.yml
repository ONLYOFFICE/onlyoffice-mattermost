name: Artifact

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
  workflow_dispatch:

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Get Info
        run: |
          echo "id=$(jq -r '.id' plugin.json)" >> $GITHUB_OUTPUT
          echo "version=$(jq -r '.version' plugin.json)" >> $GITHUB_OUTPUT
        id: info

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Build Plugin
        run: make

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.info.outputs.id }}-${{ steps.info.outputs.version }}
          path: dist/${{ steps.info.outputs.id }}-${{ steps.info.outputs.version }}.tar.gz
